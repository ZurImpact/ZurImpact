name: CD - Build & Push Images

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.github.zhaw.ch
  IMAGE_PREFIX: ghcr.github.zhaw.ch/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push - ${{ matrix.component }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/zurimpact-${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image tags
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Component:** ${{ matrix.component }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Update image tag in Infrastructure repo" >> $GITHUB_STEP_SUMMARY
          echo "2. ArgoCD will automatically sync the changes" >> $GITHUB_STEP_SUMMARY

  notify-deployment:
    name: Deployment Preparation Summary
    runs-on: self-hosted
    needs: [build-and-push]

    steps:
      - name: Create deployment summary
        run: |
          echo "# 🚀 Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker images have been built and pushed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Images Published" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}/zurimpact-backend:${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}/zurimpact-frontend:${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ArgoCD GitOps Deployment" >> $GITHUB_STEP_SUMMARY
          echo "To deploy these images:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the Infrastructure repository" >> $GITHUB_STEP_SUMMARY
          echo "2. Update the image tags in the appropriate Kustomize overlays:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`backend/overlays/<env>/kustomization.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`frontend/overlays/<env>/kustomization.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Commit and push the changes" >> $GITHUB_STEP_SUMMARY
          echo "4. ArgoCD will detect the changes and sync automatically" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.github.zhaw.ch" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
