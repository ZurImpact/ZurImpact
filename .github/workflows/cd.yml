name: CD - Build & Push Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push - ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/zurimpact-${{ matrix.component }}
          tags: |
            type=raw,value=${{ steps.env.outputs.version }}
            type=raw,value=${{ steps.env.outputs.environment }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image tags
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Component:** ${{ matrix.component }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  update-infra-staging:
    name: Update Infrastructure Repo (Staging)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout Infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: ZurImpact/Infrastructure
          token: ${{ secrets.INFRA_PAT }}

      - name: Update staging image tags and create PR
        env:
          GH_TOKEN: ${{ secrets.INFRA_PAT }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="dev-${SHORT_SHA}"
          BRANCH="deploy/zurimpact-staging-${SHORT_SHA}"
          OVERLAY="zurimpact/overlays/staging/kustomization.yaml"

          git checkout -b "$BRANCH"

          sed -i "s|newTag: .*|newTag: ${VERSION}|g" "$OVERLAY"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY"
          git commit -m "chore: deploy zurimpact staging to ${VERSION}"
          git push origin "$BRANCH" --force

          gh pr create \
            --repo ZurImpact/Infrastructure \
            --title "Deploy ZurImpact staging to ${VERSION}" \
            --body "$(cat <<EOF
          ## Automated Deployment — Staging

          Triggered by [ZurImpact CD](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Images:**
          - \`ghcr.io/zurimpact/zurimpact-backend:${VERSION}\`
          - \`ghcr.io/zurimpact/zurimpact-frontend:${VERSION}\`

          Merge this PR to trigger ArgoCD sync to staging.
          EOF
          )"

          gh pr merge "$BRANCH" \
            --repo ZurImpact/Infrastructure \
            --auto \
            --squash

  update-infra-prod:
    name: Update Infrastructure Repo (Production)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout Infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: ZurImpact/Infrastructure
          token: ${{ secrets.INFRA_PAT }}

      - name: Update production image tags and create PR
        env:
          GH_TOKEN: ${{ secrets.INFRA_PAT }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          BRANCH="deploy/zurimpact-prod-${VERSION}"
          OVERLAY="zurimpact/overlays/prod/kustomization.yaml"

          git checkout -b "$BRANCH"

          sed -i "s|newTag: .*|newTag: ${VERSION}|g" "$OVERLAY"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY"
          git commit -m "chore: deploy zurimpact production to ${VERSION}"
          git push origin "$BRANCH" --force

          gh pr create \
            --repo ZurImpact/Infrastructure \
            --title "Deploy ZurImpact production to ${VERSION}" \
            --body "$(cat <<EOF
          ## Production Deployment — ${VERSION}

          Triggered by [ZurImpact CD](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Images:**
          - \`ghcr.io/zurimpact/zurimpact-backend:${VERSION}\`
          - \`ghcr.io/zurimpact/zurimpact-frontend:${VERSION}\`

          Merge this PR to trigger ArgoCD sync to production.
          EOF
          )"

          gh pr merge "$BRANCH" \
            --repo ZurImpact/Infrastructure \
            --auto \
            --squash

  notify-deployment:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, update-infra-staging, update-infra-prod]
    if: always()

    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment summary
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          VERSION="${{ steps.env.outputs.version }}"
          echo "# Deployment — ${ENV}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker images pushed." >> $GITHUB_STEP_SUMMARY
          if [[ "${ENV}" == "dev" ]]; then
            echo "Infrastructure PR created and auto-merged for staging." >> $GITHUB_STEP_SUMMARY
          else
            echo "Infrastructure PR created and auto-merged for production." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}/zurimpact-backend:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}/zurimpact-frontend:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${ENV}" == "dev" ]]; then
            echo "**Next:** ArgoCD will auto-sync staging." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Next:** ArgoCD will auto-sync production." >> $GITHUB_STEP_SUMMARY
          fi
