name: CI - Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-checks:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # required for sonarqube

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y maven
          fi

      - name: Build backend
        run: mvn -B clean package -DskipTests
        working-directory: backend

      - name: Run backend tests with coverage
        run: mvn -B verify
        working-directory: backend

      - name: SonarQube scan (backend)
        # Advisory while the SonarQube server's TLS cert is being sorted out.
        # Remove continue-on-error once the infra is fixed.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=z-rimpact -Dsonar.projectName=zürimpact-backend
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

      - name: Post backend coverage to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: "☕ Backend Code Coverage"
          update-comment: true

  frontend-checks:
    name: Frontend - Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # required for sonarqube

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: frontend

      - name: Run ESLint
        run: yarn lint
        working-directory: frontend

      - name: Run Prettier check
        run: yarn prettier --check .
        working-directory: frontend

      - name: Run tests with coverage
        run: yarn test:coverage
        working-directory: frontend
      
      - name: SonarQube Scan for Frontend
        # Advisory while the SonarQube server's TLS cert is being sorted out.
        # Remove continue-on-error once the infra is fixed.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=z-rimpact-frontend
            -Dsonar.projectName=zürimpact-frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: Post frontend coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: frontend
          name: "⚛️ Frontend Code Coverage"

      - name: Build frontend
        run: yarn build
        working-directory: frontend

  frontend-e2e:
    name: Frontend - E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    # Kept non-blocking while the suite is bedded in. Flip to false once the
    # suite is stable to make e2e a required signal.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: frontend

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright tests
        run: yarn e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 14

  docker-build-test:
    name: Docker - Build Test
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: zurimpact/${{ matrix.component }}:test

  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, docker-build-test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.backend-checks.result }}" != "success" ] || \
             [ "${{ needs.frontend-checks.result }}" != "success" ] || \
             [ "${{ needs.docker-build-test.result }}" != "success" ]; then
            echo "❌ CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
