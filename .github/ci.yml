name: CI - Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend - Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y maven
          fi

      - name: Build backend
        run: mvn -B clean package -DskipTests
        working-directory: backend

      - name: Run backend tests
        run: mvn -B test
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  frontend-checks:
    name: Frontend - Build & Lint
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: |
          if ! command -v yarn &> /dev/null; then
            npm install -g yarn
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Run ESLint
        run: yarn lint
        working-directory: frontend

      - name: Run Prettier
        run: yarn prettier --write .
        working-directory: frontend

      - name: Build frontend
        run: yarn build
        working-directory: frontend

  docker-build-test:
    name: Docker - Build Test
    runs-on: self-hosted
    needs: [backend-checks, frontend-checks]

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: zurimpact/${{ matrix.component }}:test

  ci-success:
    name: CI Passed
    runs-on: self-hosted
    needs: [backend-checks, frontend-checks, docker-build-test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.backend-checks.result }}" != "success" ] || \
             [ "${{ needs.frontend-checks.result }}" != "success" ] || \
             [ "${{ needs.docker-build-test.result }}" != "success" ]; then
            echo "❌ CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
