services:
  postgres-db:
    image: postgres:16
    container_name: local-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_database
    ports:
      - "5432:5432"
    volumes:
      # init.sql is intentionally empty — schema is managed by Flyway
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d app_database" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .. # build context is the backend/ folder
      dockerfile: Dockerfile
    container_name: local-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      # Override DB_URL to use the Docker service name instead of localhost
      DB_URL: jdbc:postgresql://postgres-db:5432/app_database
    depends_on:
      postgres-db:
        condition: service_healthy
