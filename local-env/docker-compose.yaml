services:
  postgres-db:
    image: postgres:16
    container_name: local-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d app_database" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: local-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: local-frontend
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./local-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend